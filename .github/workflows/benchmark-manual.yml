name: Manual Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: true
        type: choice
        options:
          - ready-price-average
          - csv-full-row-processing
          - csv-filtered-price-sum-end-to-end
          - ready-price-sum
          - ready-filtered-price-sum
          - max-by-double
      row_count:
        description: Number of rows
        required: true
        type: choice
        options:
          - "1000"
          - "100000"
          - "1000000"
          - "10000000"
      preset:
        description: Warmup, measurement, and fork preset
        required: true
        type: choice
        options:
          - smoke
          - default
          - extended

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Temurin JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Resolve controlled benchmark configuration
        id: benchmark
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          PRESET: ${{ inputs.preset }}
        run: |
          case "$SUITE" in
            ready-price-average)
              benchmark_class=io.github.jutil.performancelab.ReadyPriceAverageBenchmark
              ;;
            csv-full-row-processing)
              benchmark_class=io.github.jutil.performancelab.CsvFullRowProcessingBenchmark
              ;;
            csv-filtered-price-sum-end-to-end)
              benchmark_class=io.github.jutil.performancelab.CsvFilteredPriceSumEndToEndBenchmark
              ;;
            ready-price-sum)
              benchmark_class=io.github.jutil.performancelab.ReadyPriceSumBenchmark
              ;;
            ready-filtered-price-sum)
              benchmark_class=io.github.jutil.performancelab.ReadyFilteredPriceSumBenchmark
              ;;
            max-by-double)
              benchmark_class=io.github.jutil.performancelab.MaxByDoubleBenchmark
              ;;
            *)
              echo "Unsupported suite: $SUITE" >&2
              exit 1
              ;;
          esac

          case "$PRESET" in
            smoke)
              warmup_iterations=1
              measurement_iterations=1
              forks=1
              ;;
            default)
              warmup_iterations=2
              measurement_iterations=3
              forks=1
              ;;
            extended)
              warmup_iterations=5
              measurement_iterations=10
              forks=2
              ;;
            *)
              echo "Unsupported preset: $PRESET" >&2
              exit 1
              ;;
          esac

          echo "benchmark_class=$benchmark_class" >> "$GITHUB_OUTPUT"
          echo "warmup_iterations=$warmup_iterations" >> "$GITHUB_OUTPUT"
          echo "measurement_iterations=$measurement_iterations" >> "$GITHUB_OUTPUT"
          echo "forks=$forks" >> "$GITHUB_OUTPUT"

      - name: Verify benchmark project
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Generate requested CSV dataset
        if: ${{ inputs.suite != 'ready-price-average' && inputs.suite != 'max-by-double' }}
        env:
          ROW_COUNT: ${{ inputs.row_count }}
        run: |
          java -cp benchmark-jmh/target/benchmarks.jar \
            io.github.jutil.performancelab.CsvDatasetGenerator \
            "$ROW_COUNT"

      - name: Run selected benchmark class
        shell: bash
        env:
          BENCHMARK_CLASS: ${{ steps.benchmark.outputs.benchmark_class }}
          FORKS: ${{ steps.benchmark.outputs.forks }}
          MEASUREMENT_ITERATIONS: ${{ steps.benchmark.outputs.measurement_iterations }}
          PRESET: ${{ inputs.preset }}
          ROW_COUNT: ${{ inputs.row_count }}
          SUITE: ${{ inputs.suite }}
          WARMUP_ITERATIONS: ${{ steps.benchmark.outputs.warmup_iterations }}
        run: |
          mkdir -p target
          jmh_args=(
            "$BENCHMARK_CLASS"
            -p "rowCount=$ROW_COUNT"
            -wi "$WARMUP_ITERATIONS"
            -i "$MEASUREMENT_ITERATIONS"
            -f "$FORKS"
            -rf json
            -rff target/jmh-results.json
          )

          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "suite=$SUITE"
            echo "row_count=$ROW_COUNT"
            echo "preset=$PRESET"
            echo "benchmark_class=$BENCHMARK_CLASS"
            echo "warmup_iterations=$WARMUP_ITERATIONS"
            echo "measurement_iterations=$MEASUREMENT_ITERATIONS"
            echo "forks=$FORKS"
            printf 'jmh_command='
            printf ' %q' java -jar benchmark-jmh/target/benchmarks.jar "${jmh_args[@]}"
            printf '\n\njava_version:\n'
            java -version 2>&1
            printf '\nmaven_version:\n'
            ./mvnw --version
            printf '\nos_information:\n'
            uname -a
            cat /etc/os-release
            printf '\ncpu_information:\n'
            lscpu
          } > target/benchmark-metadata.txt

          java -jar benchmark-jmh/target/benchmarks.jar "${jmh_args[@]}"

      - name: Upload benchmark results and metadata
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.suite }}-${{ inputs.row_count }}-${{ inputs.preset }}-${{ github.sha }}
          path: |
            target/jmh-results.json
            target/benchmark-metadata.txt
          if-no-files-found: error
