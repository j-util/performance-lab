name: Bencher Benchmarks

on:
  workflow_dispatch:

jobs:
  verify-trigger:
    runs-on: ubuntu-latest
    environment: bencher-publish

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - uses: bencherdev/bencher@main

      - name: Build benchmark project
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Generate benchmark dataset
        run: |
          java -cp target/benchmarks.jar \
            io.github.jutil.performancelab.CsvDatasetGenerator \
            10000

      - name: List JMH benchmarks
        run: java -jar target/benchmarks.jar -l

      - name: Validate Bencher integration
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project performance-lab \
            --branch bencher-integration \
            --testbed github-ubuntu-latest \
            --adapter java_jmh \
            --file target/jmh-smoke.json \
            --dry-run \
            "java -jar target/benchmarks.jar \
              CsvFullRowBenchmark \
              -p rowCount=10000 \
              -wi 1 \
              -i 1 \
              -f 1 \
              -r 1s \
              -w 1s \
              -rf json \
              -rff target/jmh-smoke.json"